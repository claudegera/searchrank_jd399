[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claudegera-searchrank_jd399"
version = "0.1.0"
description = "把候选项映射到类别上，算出搜索排序算法工程师·拒答边界与过度拒答的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "claudegera" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://claudegera.github.io"
Repository = "https://github.com/claudegera/searchrank_jd399"
Issues = "https://github.com/claudegera/searchrank_jd399/issues"

[project.scripts]
searchrank_jd399 = "searchrank_jd399:main"

[tool.setuptools]
py-modules = ["searchrank_jd399"]
